server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # /projects redirects to /projects/ on whatever host and port the visitor used, not this one's.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # An unknown address gets the not-found page with a 404 status.
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
    # Pages are small; always check for a newer one.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.inc;
  }

  # Vite puts a content hash in these file names, so they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.inc;
  }

  # Renders and photos keep their names when they are replaced, so a day at most.
  location ~* \.(webp|webm|mp4|svg)$ {
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/security-headers.inc;
  }
}
